# This config file is for getting default values, for use in propertymodifier-common.toml. It is NOT directly usable!
[item_groups]
    [item_groups.icon]
        building_blocks = "minecraft:bricks"
        decorations = "minecraft:peony"
        redstone = "minecraft:redstone"
        transportation = "minecraft:powered_rail"
        hotbar = "minecraft:bookshelf"
        search = "minecraft:compass"
        misc = "minecraft:lava_bucket"
        food = "minecraft:apple"
        tools = "minecraft:iron_axe"
        combat = "minecraft:golden_sword"
        brewing = "minecraft:potion"
        inventory = "minecraft:chest"
        another_furniture = "another_furniture:oak_chair"
        kubejs.kubejs = "minecraft:purple_dye"
        tabSereneSeasons = "sereneseasons:ss_icon"
    # If not listed, the value for an item group is false.
    [item_groups.search]
        search = true
    # If not listed, the value for an item group is "minecraft:textures/gui/container/creative_inventory/tab_items.png".
    [item_groups.background]
        search = "minecraft:textures/gui/container/creative_inventory/tab_item_search.png"
        inventory = "minecraft:textures/gui/container/creative_inventory/tab_inventory.png"
    # If not listed, the value for an item group is [].
    [item_groups.enchantments]
        tools = ["vanishable", "digger", "fishing_rod", "breakable"]
        combat = ["vanishable", "armor", "armor_feet", "armor_head", "armor_legs", "armor_chest", "bow", "weapon", "wearable", "breakable", "trident", "crossbow"]
# Note: For blocks with multiple states, only the value of the default state is listed.
[blocks_and_blockstates]
    # If not listed, the value for a block is 0.
